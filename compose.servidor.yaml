# ============================================================
# compose.servidor.yaml | Modo servidor (cómo quedaría en producción)
#
#   - Django con Gunicorn, DEBUG apagado y secretos tomados del .env
#   - Caddy como única puerta de entrada (puerto 80): tienda, panel, API y fotos
#   - La base de datos no expone su puerto fuera de Docker
#
# Es independiente de docker-compose.yml: no se levantan los dos a la vez.
# Usa la misma base (volumen postgres_data), así que los datos son los mismos.
# Pasos en el README, sección «Modo servidor».
# ============================================================

services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proyecto_db}
      POSTGRES_USER: ${POSTGRES_USER:-proyecto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proyecto_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    # SECRET_KEY, DJANGO_ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, Mercado Pago, mail...
    env_file: .env
    environment:
      DEBUG: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # El entrypoint espera la base y aplica migraciones; después arranca Gunicorn
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
             --access-logfile - --error-logfile -"
    volumes:
      # Fotos subidas: quedan en la carpeta media/ del proyecto (igual que en desarrollo)
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/srv/media:ro
      # Front compilado con «npm run build» (ruta configurable en el .env)
      - ${FRONT_DIST:-../Sistema_Guinda_DesarrolloWeb/dist}:/srv/front:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
